<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — WealthNest</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">W</span>WealthNest</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="learn.html">Learn</a>
    </nav>
    <div class="header-actions">
      <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to continue managing your finances.</p>

    <div id="login-error" class="auth-error"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
    <p class="form-hint text-center" style="margin-top:18px;">Demo account: demo@wealthnest.in / Demo@1234</p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
