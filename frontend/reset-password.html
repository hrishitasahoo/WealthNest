<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — WealthNest</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">W</span>WealthNest</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="learn.html">Learn</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn btn-secondary">Login</a>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>

    <div id="reset-error" class="auth-error"></div>
    <div id="reset-success" class="auth-success"></div>

    <form id="reset-password-form" novalidate>
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmNewPassword">Confirm new password</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required minlength="8" autocomplete="new-password">
      </div>
      <p class="form-hint" style="margin-top:-10px;margin-bottom:16px;">Use at least 8 characters, including letters and numbers.</p>
      <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>

    <div class="auth-switch">
      <a href="login.html">Back to login</a>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
