<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — WealthNest</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">W</span>WealthNest</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="learn.html">Learn</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-sub">Start understanding your money in a few minutes.</p>

    <div id="register-error" class="auth-error"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" minlength="8">
        </div>
      </div>
      <p class="form-hint" style="margin-top:-10px;margin-bottom:16px;">Use at least 8 characters, including letters and numbers.</p>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-switch">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
