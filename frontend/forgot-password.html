<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — WealthNest</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">W</span>WealthNest</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="learn.html">Learn</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn btn-secondary">Login</a>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="auth-sub">Enter the email address associated with your WealthNest account and we'll send you a link to reset your password.</p>

    <div id="forgot-error" class="auth-error"></div>
    <div id="forgot-success" class="auth-success"></div>

    <form id="forgot-password-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <div class="auth-switch">
      <a href="login.html">Back to Login</a>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
